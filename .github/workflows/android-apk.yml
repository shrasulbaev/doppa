# Собирает APK для установки на Android без магазина.
# Запуск: вкладка Actions → «Android APK» → Run workflow. Готовый файл — в Artifacts.
name: Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        env:
          EXPO_OFFLINE: 1
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: doppa-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      # Ссылка для скачивания прямо на телефон: GitHub → Releases
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk doppa.apk
          gh release create "apk-${{ github.run_number }}" doppa.apk --prerelease \
            --target "${{ github.event.pull_request.head.sha || github.sha }}" \
            --title "Doppa APK #${{ github.run_number }}" \
            --notes "Тестовая сборка для Android. Откройте doppa.apk на телефоне и разрешите установку из этого источника."
